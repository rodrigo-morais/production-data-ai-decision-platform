[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "production-data-ai-decision-platform"
version = "0.1.0"
description = "Typed, evaluated decision workflows with Prefect, model routing, and fail-closed gates"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Morais" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "prefect>=3.1,<4",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
decision-demo = "decision_platform.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["decision_platform"]
